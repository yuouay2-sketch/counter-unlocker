name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon=icon.ico --name="Counter Unlocer" counter_unlocer.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Unlocer-Windows
          path: dist/Counter Unlocer.exe
